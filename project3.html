<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance - Safwan</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .maintenance-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .maintenance-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 2s infinite; /* Animasi di sini */
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }

    .maintenance-container h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #f4c542; /* Guna warna kuning tema kau */
    }

    .maintenance-container p {
      max-width: 400px;
      color: #777;
      margin-bottom: 30px;
    }

    .btn-back {
      padding: 12px 25px;
      background: #f4c542;
      color: #000;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-back:hover {
      background: #f4c542;
      transform: translateY(-3px);
    }

    /* Dark Mode Support */
    body.dark .maintenance-container p {
      color: #bbb;
    }
  </style>
</head>
<body>

  <!-- Tetap masukkan Navbar supaya user boleh navigasi balik -->
  <header class="navbar">
    <a href="index.html" class="logo">SFWN</a>
    <nav id="nav-menu" class="side-menu">
      <a href="index.html#home" class="nav-link">Home</a>
      <a href="index.html#projects" class="nav-link">Projects</a>
      <span id="theme-toggle">🌙</span>
    </nav>
  </header>

  <main class="maintenance-container">
    <div class="maintenance-icon">🛠️</div>
    <h1>Under Maintenance</h1>
    <p>I'm currently coding some awesome new website designs. This section will be ready soon!</p>
    <a href="index.html#projects" class="btn-back">Go Back Home</a>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
